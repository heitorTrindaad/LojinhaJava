# ==========================================
# Configurações Gerais da Aplicação
# ==========================================
spring.application.name=LojinhaJava

# Porta padrão para ambos os ambientes
server.port=8080

# ==========================================
# Configuração do Banco de Dados (Dinâmico)
# ==========================================
# Se a variável DB_HOST não existir (ambiente local), ele usa 'localhost'. 
# Se existir (Docker), o compose injeta o valor correto.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lojinhadb}?createDatabaseIfNotExist=true&serverTimezone=UTC

spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Configurações do Hibernate / JPA
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Configuração de Segurança (JWT)
# ==========================================
api.security.token.secret=${JWT_SECRET:bandido-nao-chora-chora-bandido-quer-chocolex}